# MANUAL SETUP REQUIRED: Firebase Hosting on the same GCP project, WIF SA with Hosting Admin.
# See docs/setup/firebase-hosting.md

name: Deploy Frontend

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != '' && vars.PUBLIC_API_URL != ''
    runs-on: ubuntu-latest
    environment: gcp
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          set -euo pipefail
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT PUBLIC_API_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing variable $v"
              exit 1
            fi
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

      - id: auth
        name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          NEXT_PUBLIC_AUTH_REQUIRED: ${{ vars.NEXT_PUBLIC_AUTH_REQUIRED || 'false' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@14.14.0 deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Publish frontend URL
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="https://${{ vars.GCP_PROJECT_ID }}.web.app"
          echo "::notice title=Frontend (Firebase Hosting)::${SITE}"
          gh repo edit "${{ github.repository }}" --homepage "$SITE" --description "Hackathon web app (Firebase Hosting)"
