# MANUAL SETUP REQUIRED: GitHub environment "gcp", GCP project, WIF, Artifact Registry, Cloud Run.
# See docs/setup/github-google-oidc.md and docs/deployment/cloud-run.md

name: Deploy API

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  administration: write
  actions: write

env:
  SERVICE_NAME: ai-hackathon-api
  IMAGE_NAME: ai-hackathon-api

jobs:
  deploy:
    # Skips until GitHub Variables are set (see docs/setup/github-google-oidc.md).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: gcp
    steps:
      - uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          set -euo pipefail
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_WIF_SERVICE_ACCOUNT GCP_ARTIFACT_REPO; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing repository variable $v (Settings → Secrets and variables → Actions → Variables)."
              exit 1
            fi
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}

      - id: auth
        name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --concurrency 80 \
            --set-env-vars "ENVIRONMENT=cloud,APP_VERSION=0.1.0,GIT_SHA=${{ github.sha }},GEMINI_MODEL=gemini-2.5-flash,AUTH_REQUIRED=false" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest"

      - name: Smoke test API
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "API_BASE_URL=$URL" >> "$GITHUB_ENV"
          chmod +x scripts/smoke-api.sh
          API_BASE_URL="$URL" scripts/smoke-api.sh

      - name: Publish live API link for the team
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOCS_URL="${API_BASE_URL}/docs"
          gh variable set BACKEND_API_URL --body "$DOCS_URL" --repo "${{ github.repository }}"
          gh repo edit "${{ github.repository }}" --homepage "$API_BASE_URL" --description ""
          echo "::notice title=Backend API (Swagger)::${DOCS_URL}"
